# Links: once a week, checks every link in the README, the repo docs and the
# skills' Markdown, so a moved page or a deleted file shows up. It never runs
# on pull requests, so an outside site being down can't block a merge.
# A failed run shows on the Actions tab and GitHub emails the repo owner.
name: Links

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links (lychee)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Markdown only. Built kit/ copies are checked at their source in kit-src/.
      # localhost and example hosts in the skills are placeholders, not links.
      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --exclude-loopback
            --extensions md
            --exclude-path '/kit/'
            --exclude '^https?://(www\.)?example\.(com|org)'
            --max-retries 3
            README.md CONTRIBUTING.md docs/ kit-src/ skills/
          fail: true
