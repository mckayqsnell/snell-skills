# CI: validates every pull request before it can be merged.
# See docs/how-it-works.md for what each safety setting below guards against.
name: CI

on:
  pull_request:

# Default for every job: read-only access to the repo. Jobs ask for more
# only if they need it (none here do).
permissions:
  contents: read

# A new push to the same pull request cancels the older, now-stale run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Plugin, skills, scripts and scrub
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies (exact versions from pnpm-lock.yaml)
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Run the check suite
        run: |
          set -euo pipefail
          shellcheck --version
          pnpm run check

  workflows:
    name: Lint workflows (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      # sha256 of actionlint_1.7.12_linux_amd64.tar.gz, from the release's checksums file.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.31.1
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint (download, verify checksum, run)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tmp/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  $tmp/$tarball" | sha256sum --check --strict
          tar -xzf "$tmp/$tarball" -C "$tmp" actionlint
          "$tmp/actionlint" -version
          "$tmp/actionlint" -color

      - name: zizmor (security audit of the workflows)
        run: |
          set -euo pipefail
          pipx run "zizmor==${ZIZMOR_VERSION}" --offline .github/
