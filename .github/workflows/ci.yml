# CI: validates every pull request before it can be merged.
# Each job runs a few steps of scripts/check.sh (`--only <steps>`), so CI and
# `pnpm run check` share one list of checks. The jobs run side by side.
# See docs/how-it-works.md for what each safety setting below guards against.
name: CI

on:
  pull_request:

# Default for every job: read-only access to the repo. Jobs ask for more
# only if they need it (none here do).
permissions:
  contents: read

# A new push to the same pull request cancels the older, now-stale run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The only checks that need node_modules (the claude, skills, yaml and
  # markdownlint packages).
  plugin:
    name: Plugin, skills and Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies (exact versions from pnpm-lock.yaml)
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Version, plugin validate, skills listing, frontmatter, markdownlint
        run: |
          set -euo pipefail
          bash scripts/check.sh --only version,validate,skills-list,frontmatter,markdownlint

  # Plain Node and shell tools: no install step.
  lint:
    name: Scripts, links and scrub
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: shellcheck, node --check, SKILL.md paths, scrub, CI covers every step
        run: |
          set -euo pipefail
          shellcheck --version
          bash scripts/check.sh --only shellcheck,node-syntax,links,scrub,ci-steps

  kit:
    name: Kit tests, sync and plain language
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Tests, kit sync, plain-language floor
        run: |
          set -euo pipefail
          bash scripts/check.sh --only tests,kit-sync,plain-language

  changeset:
    name: Changeset for skill changes
    # The release workflow's Version Packages PR uses up the changesets. Only
    # that branch in this repo is skipped; a fork can't dodge the rule by name.
    if: >-
      github.head_ref != 'changeset-release/main' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the code (full history, to compare with main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # Only @changesets/cli is needed, and it has no install scripts.
      - name: Install dependencies (exact versions, no install scripts)
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Require a changeset when skills/ changes
        env:
          CHANGESET_BASE: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          bash scripts/check.sh --only changeset

  # demo-video on the three OSes people run it on: check-setup.mjs must name the
  # right OS file and report ready, the cut test, finding playwright-cli through
  # its shims (Windows has no `sh`), and a real recorded take at 3200x1800.
  demo-video:
    name: demo-video on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, runner: ubuntu-24.04, os: linux }
          - { name: Windows, runner: windows-2025, os: windows }
          - { name: macOS, runner: macos-15, os: macos }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json "packageManager")
        if: hashFiles('skills/media/demo-video/scripts/*.mjs') != ''
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - name: Set up Node.js
        if: hashFiles('skills/media/demo-video/scripts/*.mjs') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # Only @playwright/cli (pinned in pnpm-lock.yaml) is used here: no install scripts needed.
      - name: Install dependencies (exact versions, no install scripts)
        if: hashFiles('skills/media/demo-video/scripts/*.mjs') != ''
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          # pnpm's playwright-cli shim on PATH for the steps below, the way a global install is.
          if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$PWD/node_modules/.bin"; else printf '%s\n' "$PWD/node_modules/.bin"; fi >> "$GITHUB_PATH"

      # The install line os/<os>.md gives, skipped when the runner image has ffmpeg.
      - name: Install ffmpeg
        if: hashFiles('skills/media/demo-video/scripts/*.mjs') != ''
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            case "$RUNNER_OS" in
              Linux)
                # Skips man-db's slow index rebuild, and only refreshes the package
                # lists if the runner's copy is too old to install from.
                sudo rm -f /var/lib/man-db/auto-update
                get_ffmpeg() { sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null; }
                get_ffmpeg || { sudo apt-get update -qq && get_ffmpeg; } ;;
              Windows) choco install ffmpeg -y --no-progress >/dev/null ;;
              macOS) brew install --quiet ffmpeg ;;
            esac
          fi
          ffmpeg -hide_banner -version | head -1

      - name: check-setup.mjs names this OS and is ready
        if: hashFiles('skills/media/demo-video/scripts/*.mjs') != ''
        env:
          WANT_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          node skills/media/demo-video/scripts/check-setup.mjs
          node scripts/ci/demo-video-os.mjs --want "$WANT_OS"

      # Skips with a note when the demo-video skill is not in the branch.
      - name: Cut a test clip and map its times
        run: |
          set -euo pipefail
          bash scripts/check.sh --only demo-video

      # Every shim format (npm -g, pnpm, sh) is read as text; then, from an empty
      # folder, find the Playwright behind pnpm's real shim (as a global install is found).
      - name: Find playwright-cli through its shim
        if: hashFiles('skills/media/demo-video/scripts/*.mjs') != ''
        run: |
          set -euo pipefail
          node scripts/ci/demo-video-shims.mjs
          finder="$PWD/skills/media/demo-video/scripts/find-playwright.mjs"
          cd "$RUNNER_TEMP"
          found="$(node "$finder")"
          echo "$found"
          case "$found" in *playwright-core*) ;; *) echo "find-playwright.mjs did not find playwright-core" >&2; exit 1 ;; esac

      # A real 1 s take at the skill's default 1280x720 at 2.5x in headless Chrome (on
      # every runner image): the page size, frames, the ffmpeg concat list, the MP4 and
      # the event log. Then cleanup.
      - name: Record a short take, then clean up
        if: hashFiles('skills/media/demo-video/scripts/*.mjs') != ''
        run: |
          set -euo pipefail
          take="$PWD/scripts/ci/demo-video-take.mjs"
          node skills/media/demo-video/scripts/setup.mjs "$RUNNER_TEMP" take-ws >/dev/null
          ws="$RUNNER_TEMP/take-ws"
          cd "$RUNNER_TEMP"
          node "$take" "$ws"
          node "$ws/recorder/cleanup.mjs" --add-session ci-take
          out="$(node "$ws/recorder/cleanup.mjs")"
          echo "$out"
          case "$out" in *"could not close"*) exit 1 ;; esac

  workflows:
    name: Lint workflows (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      # sha256 of actionlint_1.7.12_linux_amd64.tar.gz, from the release's checksums file.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.31.1
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint (download, verify checksum, run)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tmp/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  $tmp/$tarball" | sha256sum --check --strict
          tar -xzf "$tmp/$tarball" -C "$tmp" actionlint
          "$tmp/actionlint" -version
          "$tmp/actionlint" -color

      # auditor: zizmor's strictest mode, with every audit on.
      - name: zizmor (security audit of the workflows)
        run: |
          set -euo pipefail
          pipx run "zizmor==${ZIZMOR_VERSION}" --offline --persona=auditor .github/

  # One status to require in branch protection: green only when every job
  # above passed (or was skipped on purpose).
  all-checks:
    name: All checks
    if: ${{ !cancelled() }}
    needs: [plugin, lint, kit, changeset, demo-video, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A CI job ended as '$r'."; exit 1 ;;
            esac
          done
